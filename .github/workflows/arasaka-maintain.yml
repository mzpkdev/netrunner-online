name: Arasaka Maintain

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  maintain:
    uses: mzpkdev/preemclaud/.github/workflows/maintain.yml@v1
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      model: "claude-haiku-4-5"
      stale_days: "30"
      stale_label: "stale"
      max_actions: "10"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_APP_PRIVATE_KEY: ${{ secrets.ARASAKA_APP_PRIVATE_KEY }}
