name: Arasaka Queue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  auth:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.app-token.outputs.token }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: 3218980
          private-key: ${{ secrets.ARASAKA_APP_PRIVATE_KEY }}

  queue:
    needs: auth
    uses: mzpkdev/preemclaud/.github/workflows/queue.yml@v1
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write
    with:
      model: "claude-opus-4-6"
      queue_max_issues: "7"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_APP_TOKEN: ${{ needs.auth.outputs.token }}
