name: Arasaka Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  auth:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.app-token.outputs.token }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: 3218980
          private-key: ${{ secrets.ARASAKA_APP_PRIVATE_KEY }}

  review:
    needs: auth
    uses: mzpkdev/preemclaud/.github/workflows/review.yml@v1
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
      id-token: write
    with:
      model: "claude-sonnet-4-6"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_APP_TOKEN: ${{ needs.auth.outputs.token }}
