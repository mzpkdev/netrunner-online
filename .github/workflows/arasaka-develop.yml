name: Arasaka Develop

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  repository_dispatch:
    types: [arasaka-revise]
  check_suite:
    types: [completed]

jobs:
  develop:
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        github.event_name == 'repository_dispatch' ||
        github.event_name == 'pull_request_review' ||
        github.event_name == 'check_suite' ||
        (github.event_name == 'issue_comment' && (
          contains(github.event.comment.body, '@arasaka') ||
          github.event.issue.pull_request
        ))
      )
    uses: mzpkdev/preemclaud/.github/workflows/develop.yml@v1
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    with:
      model: "claude-sonnet-4-6"
      trigger_phrase: "@arasaka"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_APP_PRIVATE_KEY: ${{ secrets.ARASAKA_APP_PRIVATE_KEY }}
