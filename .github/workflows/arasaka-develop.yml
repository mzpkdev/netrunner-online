name: Arasaka Develop

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [arasaka-revise]

jobs:
  auth:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@arasaka'))
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.app-token.outputs.token }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: 3218980
          private-key: ${{ secrets.ARASAKA_APP_PRIVATE_KEY }}

  develop:
    needs: auth
    uses: mzpkdev/preemclaud/.github/workflows/develop.yml@v1
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    with:
      model: "claude-sonnet-4-6"
      trigger_phrase: "@arasaka"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_APP_TOKEN: ${{ needs.auth.outputs.token }}
